<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <main id="calculator">
        <div id="display">

        </div>
        <div class="buttons">
            <button class="darker">(</button>
            <button class="darker">)</button>
            <button class="darker">%</button>
            <button class="darker">AC</button>
            
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="darker">÷</button>
            
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="darker">×</button>
            
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="darker">-</button>
            
            <button>0</button> 
            <button>.</button>
            <button class="equals">=</button>
            <button class="darker">+</button>
        </div>
            
    </main>
</body>
</html>
